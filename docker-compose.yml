services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_password123"
      MSSQL_PID: "Developer"
    ports: ["1433:1433"]
    volumes:
      - mssqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 20
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  # Servico 'api' depende do Dockerfile entregue pela Pessoa 2 (src/ConexaoSolidaria.Api/Dockerfile).
  # Ate la, rode: docker compose up sqlserver rabbitmq  +  dotnet run --project src/ConexaoSolidaria.Api
  api:
    build:
      context: .
      dockerfile: src/ConexaoSolidaria.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__SqlServer: "Server=sqlserver,1433;Database=ConexaoSolidaria;User Id=sa;Password=Your_password123;TrustServerCertificate=True;"
      RabbitMq__Host: rabbitmq
      Jwt__SecretKey: troque-esta-chave-super-secreta-minima-32-caracteres!!
      Database__AutoMigrate: "true"
    ports: ["8080:8080"]
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  mssqldata:
